[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskplatform"
version = "0.1.0"
description = "Educational multi-asset portfolio risk and model validation platform (historical research, not financial advice)."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
  "duckdb>=0.10", "streamlit>=1.66", "plotly>=5.18", "openpyxl>=3.1", "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
